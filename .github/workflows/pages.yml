# Builds the public site from the repository's data and publishes it to GitHub Pages
# (decision 80). Turn it on once in Settings > Pages by setting the source to GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "cast/**"
      - "configuration/**"
      - "photos/**"
      - "graphics/**"
      - "docs/contributing.md"
      - "docs/roadmap.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
